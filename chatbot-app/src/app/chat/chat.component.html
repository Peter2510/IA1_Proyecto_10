<div class="{{ temaActual === 'dark' ? 'dark-theme' : 'light-theme' }}">
  <mat-drawer-container class="example-container">
    <!-- Drawer: barra lateral -->
    <mat-drawer #drawer mode="push" opened class="custom-drawer">
      <div class="drawer-header">
        <h3 [ngClass]="{'botsi-light': temaActual === 'light', 'botsi-dark': temaActual === 'dark'}">Chats</h3>
      </div>
      <div class="drawer-content">
        <div class="drawer-item-container">
          <div *ngFor="let item of todosCuadernos; index as i" class="drawer-list-item">
            <button mat-button color="success" class="ingreso-button" (click)="this.seleccionCuaderno(i)">
              {{ item.nombre }}
            </button>
            -
            <button mat-button color="warn" class="delete-button" (click)="this.eliminarCuaderno(i)">
              <mat-icon>delete</mat-icon> Eliminar
            </button>
          </div>
        </div>
        <hr />
        <div class="creacion-cuaderno drawer-header">
          <h3 [ngClass]="{'botsi-light': temaActual === 'light', 'botsi-dark': temaActual === 'dark'}">Crear chat</h3>
          <div class="container">
            <mat-form-field class="example-full-width">
              <mat-label>Ingresa un nombre</mat-label>
              <input matInput placeholder="" [(ngModel)]="nuevoNombre" >
            </mat-form-field>
            <button mat-flat-button (click)="this.creacionCuaderno()">
              Crear
            </button>
          </div>
        </div>
      </div>
    </mat-drawer>

    <!-- Contenido Principal -->
    <mat-drawer-content>
      <nb-layout>
        <nb-layout-header fixed class="chat-header">
          <div class="theme-button-container">
            <button mat-icon-button (click)="drawer.toggle()" class="theme-button">
              <mat-icon>menu</mat-icon>
            </button>
            <h4 [ngClass]="{'botsi-light': temaActual === 'light', 'botsi-dark': temaActual === 'dark'}">
              Botsi
            </h4>
            <button mat-button (click)="toggleTheme()" class="theme-button">
              <mat-icon>{{ temaActual === "light" ? "dark_mode" : "light_mode" }}</mat-icon>
            </button>
          </div>
        </nb-layout-header>

        <nb-layout-column>
          <nb-chat title="Chatbot" size="large" [status]="temaActual === 'dark' ? 'warning' : 'success'">
            <nb-chat-message *ngFor="let message of messages" [type]="'text'" [message]="message.text"
              [sender]="message.sender" [date]="message.date" [avatar]="message.image"
              [class.user-message]="message.sender === userName" [class.bot-message]="message.sender === botName">
              <ng-template nbChatMessageTitle>
                <div class="message-header">
                  <img [src]="message.image" alt="Avatar" class="avatar" />
                  <span class="sender">{{ message.sender }}</span>
                  <span class="date">{{ message.date | date: "yyyy-MM-dd HH:mm:ss" }}</span>
                </div>
              </ng-template>
            </nb-chat-message>
          </nb-chat>

          <div class="row">
            <div class="input-container">
              <input nbInput placeholder="Escribe tu mensaje" [(ngModel)]="userInput" (keyup.enter)="sendMessage()" />
              <button mat-raised-button color="primary" (click)="descargar()">
                <mat-icon class="download-icon">download</mat-icon>
              </button>

              <button nbButton status="primary" (click)="sendMessage()">
                Enviar
              </button>
            </div>
          </div>
        </nb-layout-column>
      </nb-layout>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
